# Assetto Corsa: Nurburgring Nordschleife (ks_nordschleife), Ferrari F40 (ferrari_f40).
# Check the layout folder on your install: content/tracks/ks_nordschleife/<layout>/ai/fast_lane.ai
# (layouts: nordschleife, touristenfahrten, endurance, endurance_cup).
#
# READ FIRST: the vehicle model is FLAT. The Nordschleife has crests where the car goes
# light, compressions, banking (Karussell) and ~300 m of elevation change, none of which
# the planner knows about. Start slow (profiles/nordschleife_f40.yaml uses speed_scale 0.80)
# and let lap-to-lap learning find the grip. Expect the first laps to need supervision.
vehicle: configs/f40.yaml
track:
  source: fast_lane_ai
  path: "C:/Program Files (x86)/Steam/steamapps/common/assettocorsa/content/tracks/ks_nordschleife/nordschleife/ai/fast_lane.ai"
  sign_z: -1          # verify with scripts/ac_probe.py
  swap_sides: false
  half_width: 4.0     # used only if the spline has no width data
  subsample: 4
raceline:
  cache: out/nordschleife_f40.npz
  ds: 5.0             # ~4160 stations; the first plan takes several minutes (cached afterwards)
  margin: 0.7         # metres kept off the edges: there is no run-off here
profile: profiles/nordschleife_f40.yaml
mpc: {N: 20, solver: sqp, sqp_iter: 2}
controller:
  dt_mpc: 0.05
  latency_s: 0.04
  tau_delta: 0.02
  tau_T: 0.08         # turbo engine: slower torque response than the pedal
  horizon_time: 1.3
  ds_max: 5.0         # look ~100 m ahead at 280 km/h
  supervisor: {offtrack_m: 1.2, beta_margin_deg: 10}
learning:
  enabled: true
  mu0: 0.85           # pessimistic start; raised lap by lap where the car copes
env:
  type: ac
  calibration: configs/ac_calibration.yaml
  vjoy_device: 1
  # The F40 has a manual gearbox: turn AC's automatic gearbox assist ON, or use:
  # auto_shift: {up_rpm: 7000, down_rpm: 3800}
live: {port: 47800, watch_profile: true}
log_dir: out/logs_ac_nordschleife
