# Offline rehearsal for a Nordschleife-length lap: F40 on an invented, FLAT ~20.8 km
# circuit in the simulator. Use it to check planning time, the dashboard and logging
# at this scale before going to the game. It is not the Nordschleife.
vehicle: configs/f40.yaml
track:
  source: synthetic_long
  length_km: 20.8
raceline:
  cache: out/synthetic_long_f40.npz
  ds: 5.0
  margin: 0.5
profile: profiles/race.yaml
mpc: {N: 20, solver: sqp, sqp_iter: 2}
controller:
  dt_mpc: 0.05
  latency_s: 0.03
  tau_delta: 0.03
  tau_T: 0.08
  horizon_time: 1.3
  ds_max: 5.0
learning:
  enabled: true
  mu0: 0.90
env:
  type: sim
  truth_scale: {mu: 0.95, ClA: 0.9, P_max: 0.97}
  delay_s: 0.02
  tau_delta: 0.03
  tau_T: 0.08
  noise: 1.0
live: {port: 47800, watch_profile: true}
log_dir: out/logs_sim_long
